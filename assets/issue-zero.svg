<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">Fayez Tamayaz — Organization Profile</title>
  <desc id="description">An editorial cover for the Fayez Tamayaz organization, open and building in public.</desc>

  <style>
    text {
      fill: #151515;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    .paper { fill: #f2eee5; }
    .paper-type { fill: #f2eee5; }
    .paper-line { stroke: #f2eee5; }
    .grid-line { stroke: #d8d2c7; }
    .accent-fill { fill: #087a51; }
    .accent-line { stroke: #087a51; }

    .label {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    .name {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 72px;
      font-weight: 800;
      letter-spacing: -3px;
    }

    .meta {
      fill: #68645d;
      font-size: 14px;
      letter-spacing: 1.5px;
    }

    .number {
      fill: none;
      stroke: #d8d2c7;
      stroke-width: 2;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: 265px;
      font-weight: 900;
      letter-spacing: -26px;
    }

    .pulse {
      animation: pulse 2.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .35; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; }
    }

    @media (prefers-color-scheme: dark) {
      text { fill: #f4f0e8; }
      .paper { fill: #101216; }
      .paper-type { fill: #101216; }
      .paper-line { stroke: #101216; }
      .grid-line { stroke: #2c3037; }
      .accent-fill { fill: #39d98a; }
      .accent-line { stroke: #39d98a; }
      .meta { fill: #aaa49a; }
      .number { stroke: #2c3037; }
    }
  </style>

  <rect class="paper" width="1200" height="440" rx="22"/>

  <g class="grid-line" stroke-width="1">
    <path d="M72 0v440M216 0v440M360 0v440M504 0v440M648 0v440M792 0v440M936 0v440M1080 0v440"/>
    <path d="M0 72h1200M0 220h1200M0 368h1200"/>
  </g>

  <path class="accent-fill" d="M0 0h258L0 258z" opacity=".96"/>
  <path class="paper-line" d="M26 26h112" stroke-width="2"/>
  <text x="26" y="58" class="label paper-type">FT / ORG</text>

  <text x="748" y="326" class="number">000</text>

  <g transform="translate(72 133)">
    <text x="220" class="label">AN OPEN ORGANIZATION</text>
    <text y="90" class="name">FAYEZ</text>
    <text y="164" class="name">TAMAYAZ</text>
    <path class="accent-line" d="M2 192h486" stroke-width="8"/>
    <text y="231" class="meta">BUILD IN PUBLIC / SHARE WHAT WORKS</text>
  </g>

  <g transform="translate(987 46)">
    <circle class="accent-line" cx="52" cy="26" r="25" fill="none" stroke-width="2"/>
    <circle class="pulse accent-fill" cx="52" cy="26" r="8"/>
    <text x="91" y="31" class="label">ACTIVE</text>
  </g>

  <g transform="translate(718 374)">
    <text class="meta">STATUS</text>
    <text x="95" class="label">BUILDING TOGETHER</text>
  </g>

  <path class="accent-line" d="M1170 412h-28v-28" fill="none" stroke-width="3"/>
</svg>
